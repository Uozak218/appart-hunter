# Appart Hunter — search criteria
# Edit freely; reloaded by the app at startup.
#
# Recherche : studio non meublé (T2 en bonus), le plus grand possible, à moins
# de ~40 min de transport de Levallois-Perret.
# Budget cible 760 € CC, plafond strict 800 € CC.

property:
  types:
    preferred: [T1]      # studio / 1 pièce
    acceptable: [T2]     # bonus si dans le budget
  min_surface:
    T1: 23
    T2: 23
  max_rent_cc: 800
  target_rent_cc: 760
  furnished: false
  floor:
    no_ground_floor: true
    elevator_required_above: 4

zones:
  include:
    # 1er cercle — collé à Levallois
    - code: "92300"
      city: "Levallois-Perret"
      insee: "92044"
    - code: "92110"
      city: "Clichy"
      insee: "92024"
    # Nord 92
    - code: "92600"
      city: "Asnières-sur-Seine"
      insee: "92004"
    - code: "92270"
      city: "Bois-Colombes"
      insee: "92009"
    - code: "92250"
      city: "La Garenne-Colombes"
      insee: "92035"
    - code: "92700"
      city: "Colombes"
      insee: "92025"
    # 93 — accès M13 / M14
    - code: "93400"
      city: "Saint-Ouen-sur-Seine"
      insee: "93070"
    # Saint-Denis : uniquement Pleyel / Stade de France / La Plaine (quartiers
    # neufs autour de la M14 et du RER D). Le reste de la ville est exclu.
    - code: "93200"
      city: "Saint-Denis"
      insee: "93066"
      areas: ["Pleyel", "Stade de France", "La Plaine"]
      include_bbox:
        min_lat: 48.900
        max_lat: 48.930
        min_lon: 2.330
        max_lon: 2.375
      include_keywords:
        - pleyel
        - stade de france
        - la plaine
        - plaine saint-denis
        - front populaire
        - landy
        - cornillon
        - wilson
    - code: "93210"
      city: "Saint-Denis"
      insee: "93066"
      areas: ["La Plaine Saint-Denis"]
    # 2e couronne de trajet (~20-40 min) — plus de m² pour le budget
    - code: "92230"
      city: "Gennevilliers"
      insee: "92036"
    # Courbevoie : uniquement le côté Bécon-les-Bruyères (pas La Défense).
    - code: "92400"
      city: "Courbevoie"
      insee: "92026"
      areas: ["Bécon-les-Bruyères"]
      include_bbox:
        min_lat: 48.899
        max_lat: 48.912
        min_lon: 2.255
        max_lon: 2.285
      include_keywords:
        - becon
        - bruyeres
    - code: "92390"
      city: "Villeneuve-la-Garenne"
      insee: "92078"
    - code: "92000"
      city: "Nanterre"
      insee: "92050"
    - code: "92500"
      city: "Rueil-Malmaison"
      insee: "92063"
    - code: "95100"
      city: "Argenteuil"
      insee: "95018"
    - code: "78800"
      city: "Houilles"
      insee: "78311"
    - code: "78500"
      city: "Sartrouville"
      insee: "78586"
    # ~45-50 min estimés (Transilien U → La Défense → L) — gardé à la demande.
    - code: "78210"
      city: "Saint-Cyr-l'École"
      insee: "78545"
  # Pas de Paris : la ligne 14 « intramuros » ne s'applique pas ici.
  line14_proximity:
    enabled: false

excludes:
  - colocation
  - sous-location
  - courte-duree
  - meuble
  - residence etudiante
  - residence services

gem_criteria:
  must_have_signals:
    - bon_rapport_surface_prix
    - proche_transports   # M13, M14, Transilien J/L, RER D, tram T2
  nice_to_have:
    - cuisine_separee_ou_equipee
    - salle_d_eau_refaite
    - tres_lumineux
    - etage_eleve
    - calme
    - balcon
    - rangements
    - cave

red_flags:
  - photos_floues
  - peu_de_photos
  - prix_anormalement_bas
  - vis_a_vis_proche
  - travaux_a_prevoir
  - humidite
  - bruit
  - sous_sol_ou_entresol
  - kitchenette_minuscule
  - surface_loi_carrez_douteuse

scoring:
  alert_threshold: 63
  urgent_threshold: 85
  price_drop_alert: true
  min_price_drop_pct: 3.0

# Prix planchers (€/m² CC) utilisés par l'anti-arnaque : une annonce < 60 % du
# plancher est traitée comme une arnaque, < 80 % est signalée « sous le marché ».
# Valeurs = loyers moyens 2026 (SeLoger / Observatoires des loyers).
market_prices:
  default_eur_per_m2: 22.0
  eur_per_m2_by_postcode:
    "92300": 31.0   # Levallois-Perret
    "92110": 28.0   # Clichy
    "92600": 24.0   # Asnières-sur-Seine
    "92270": 23.0   # Bois-Colombes
    "92250": 24.0   # La Garenne-Colombes
    "92700": 22.0   # Colombes
    "93400": 24.0   # Saint-Ouen-sur-Seine
    "93200": 21.0   # Saint-Denis (estimation)
    "93210": 21.0   # La Plaine Saint-Denis (estimation)
    # Estimations prudentes (pas de baromètre vérifié) :
    "92230": 21.0   # Gennevilliers
    "92400": 27.0   # Courbevoie (Bécon)
    "92390": 19.0   # Villeneuve-la-Garenne
    "92000": 22.0   # Nanterre
    "92500": 23.0   # Rueil-Malmaison
    "95100": 18.0   # Argenteuil
    "78800": 20.0   # Houilles
    "78500": 19.0   # Sartrouville
    "78210": 19.0   # Saint-Cyr-l'École
