[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-flat-hunter"
version = "0.1.0"
description = "Paris rental listings hunter with Claude-powered scoring and real-time alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paris Flat Hunter" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Scheduling
    "APScheduler>=3.10",
    # Scraping
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    # DataDome / Cloudflare bypass for LBC, SeLoger, PAP, Logic-Immo
    "scrapfly-sdk>=0.8",
    # Storage
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    # AI
    "anthropic>=0.34",
    # Telegram
    "python-telegram-bot>=21.0",
    # Image EXIF (photo age / recycled-listing detection)
    "Pillow>=10.0",
    # Multi-tenant: encrypt per-user Anthropic API keys at rest (Fernet).
    "cryptography>=42.0",
    # Chrome-impersonating HTTP client. Required to bypass Foncia's TLS+IP
    # fingerprinting (regular httpx/Playwright/Scrapfly get 403). Combined
    # with the iproyal residential proxy it punches through reliably.
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
pfh = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long
    "B008",   # FastAPI deps use Depends() in defaults — that's the documented pattern
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
